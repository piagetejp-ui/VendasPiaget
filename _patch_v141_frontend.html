<style>
.v141-balance-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0}.v141-balance-card{border:1px solid #e8edf3;border-radius:18px;padding:14px;background:#fff}.v141-balance-card strong{display:block;font-size:1.7rem;line-height:1.1;margin-top:4px}.v141-balance-card small{color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:.03em}.v141-status{border-radius:16px;padding:12px 14px;margin:12px 0;border:1px solid #dbeafe;background:#eff6ff;color:#1e3a8a}.v141-status.blocked{border-color:#fecaca;background:#fff1f2;color:#991b1b}.v141-status.open{border-color:#fed7aa;background:#fff7ed;color:#9a3412}.v141-payment-link{word-break:break-all;background:#f8fafc;border:1px dashed #94a3b8;border-radius:14px;padding:12px;margin-top:10px}.v141-chipbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.v141-mini{font-size:.83rem;color:#64748b}.v141-row-warn{background:#fff7ed}.v141-row-blocked{background:#fff1f2}.v141-alert-inline{padding:10px 12px;border-radius:14px;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412;margin:10px 0}.v141-actions-stack{display:flex;gap:8px;flex-wrap:wrap}.v141-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.v141-tabs button.active{background:#123a7a;color:white;border-color:#123a7a}</style>
<script>
/*
   Escola Piaget — V1.4.1 Checkout Oficial
   Base: V1.3.4 aprovada. A V1.4.0 anterior foi descartada.
   Motor novo: conta corrente do aluno + InfinitePay para entrada positiva.
*/
(function(){
const V141_VERSION='1.4.1-checkout-oficial';
const CHECKOUT_COLLECTION_V141='pagamentos_checkout';
function centsV141(v){return Math.round(Number(v||0));}
function accountNetV141(acc){if(acc&&typeof acc.saldoContaCentavos==='number')return centsV141(acc.saldoContaCentavos);return centsV141(acc?.saldoCreditoCentavos)-centsV141(acc?.dividaCentavos);}
function splitNetV141(net){net=centsV141(net);return {saldoCreditoCentavos:Math.max(0,net),dividaCentavos:Math.max(0,-net),saldoContaCentavos:net};}
function isBlockedV141(acc){return Boolean(acc?.bloqueioManual||acc?.bloqueioSaldoSemanal||acc?.bloqueadoPorLimite);}
function blockedReasonV141(acc){if(acc?.bloqueioManual)return 'Bloqueio manual da secretaria/gestão';if(acc?.bloqueioSaldoSemanal)return 'Bloqueio semanal por saldo em aberto';if(acc?.bloqueadoPorLimite)return 'Limite de saldo em aberto atingido';return 'Conta liberada';}
function cfgV141(){return {limiteMaximoFiadoCentavos:centsV141(state.config?.limiteMaximoFiadoCentavos||5000),valorMinimoCheckoutPositivoCentavos:centsV141(state.config?.valorMinimoCheckoutPositivoCentavos||100),bloqueioSemanalSaldoAtivo:state.config?.bloqueioSemanalSaldoAtivo!==false,permitirMultiplosLinksPendentes:state.config?.permitirMultiplosLinksPendentes!==false,diaBloqueioSemanalSaldo:state.config?.diaBloqueioSemanalSaldo||'sexta'};}
function fmtSignedV141(c){const n=centsV141(c);return (n<0?'-':'')+fmt(Math.abs(n));}
function canStaffCheckoutV141(){return state.user&&['secretaria','gestao','admin'].includes(state.user.perfil);}
function canStaffManageV141(){return state.user&&['secretaria','gestao','admin'].includes(state.user.perfil);}
function actorV141(){return state.user?{id:state.user.id,nome:state.user.nome,perfil:state.user.perfil}:{id:'portal_responsavel',nome:state.parentStudent?.responsavelFinanceiro||'Responsável',perfil:'responsavel'};}
function paymentMethodLabelV141(m){const map={dinheiro:'Dinheiro',pix_manual:'Pix manual',pix_banco:'Pix banco',pix_rede:'Pix Rede / Laranjinha',cartao_rede:'Cartão Rede / Laranjinha',maquininha:'Maquininha',checkout_infinitepay:'Checkout InfinitePay'};return map[m]||m||'-';}
function paymentStatusLabelV141(s){const map={aguardando_pagamento:'Aguardando pagamento',pago:'Pago',erro_gerar_link:'Erro ao gerar link',erro_sem_url:'Erro sem URL',cancelado:'Cancelado'};return map[s]||s||'-';}
function normalizeCheckoutUrlV141(url){return String(url||'').trim();}
async function getSavedBuyerV141(alunoId){try{const s=await db.collection('dados_pagamento_responsavel').doc(alunoId).get();return s.exists?(s.data().customer||{}):{}}catch(e){return {}}}
async function pendingCheckoutsV141(alunoId){try{const snap=await db.collection(CHECKOUT_COLLECTION_V141).where('alunoId','==',alunoId).get();return snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>['aguardando_pagamento','erro_gerar_link','erro_sem_url'].includes(x.status||'aguardando_pagamento')).sort((a,b)=>String(b.criadoEm).localeCompare(String(a.criadoEm))).slice(0,10)}catch(e){console.warn('pendingCheckoutsV141',e);return []}}
async function recentCheckoutsV141(limit=40){try{const snap=await db.collection(CHECKOUT_COLLECTION_V141).get();return snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.criadoEm).localeCompare(String(a.criadoEm))).slice(0,limit)}catch(e){console.warn('recentCheckoutsV141',e);return []}}
async function ensureAccountSyncV141(alunoId){const ref=db.collection('contas_alunos').doc(alunoId),snap=await ref.get();const acc=snap.exists?snap.data():{alunoId,saldoCreditoCentavos:0,dividaCentavos:0,limiteFiadoCentavos:cfgV141().limiteMaximoFiadoCentavos};const net=accountNetV141(acc);await ref.set({...splitNetV141(net),limiteFiadoCentavos:centsV141(acc.limiteFiadoCentavos||cfgV141().limiteMaximoFiadoCentavos),atualizadoEm:nowIso()},{merge:true});return {...acc,...splitNetV141(net)};}
window.accountNetV141=accountNetV141;

const _getAccountV141Before=window.getAccount;
window.getAccount=getAccount=async function(id){const s=await db.collection('contas_alunos').doc(id).get();const base=s.exists?s.data():{alunoId:id,saldoCreditoCentavos:0,dividaCentavos:0,limiteFiadoCentavos:cfgV141().limiteMaximoFiadoCentavos,bloqueioManual:false,bloqueadoPorLimite:false,bloqueioSaldoSemanal:false};const net=accountNetV141(base);return {...base,saldoContaCentavos:net};};

function balanceSummaryHtmlV141(acc){const net=accountNetV141(acc),open=Math.max(0,-net),credit=Math.max(0,net);return `<div class="v141-balance-box"><div class="v141-balance-card"><small>Saldo da conta</small><strong>${fmtSignedV141(net)}</strong><div class="v141-mini">positivo = crédito · negativo = saldo em aberto</div></div><div class="v141-balance-card"><small>Saldo em aberto</small><strong>${fmt(open)}</strong><div class="v141-mini">valor mínimo para regularizar quando negativo</div></div><div class="v141-balance-card"><small>Crédito disponível</small><strong>${fmt(credit)}</strong><div class="v141-mini">usado em novas compras</div></div></div>`}
function accountStatusHtmlV141(acc){const net=accountNetV141(acc),blocked=isBlockedV141(acc);if(blocked)return `<div class="v141-status blocked"><strong>Conta bloqueada.</strong><br>${esc(blockedReasonV141(acc))}. ${net<0?`Para desbloquear, regularize pelo menos ${fmt(Math.abs(net))}.`:'A conta será liberada ao regularizar a pendência.'}</div>`;if(net<0)return `<div class="v141-status open"><strong>Saldo em aberto.</strong><br>A conta ainda pode operar dentro do limite definido, mas será bloqueada no fechamento semanal de sexta-feira se continuar negativa.</div>`;return `<div class="v141-status"><strong>Conta liberada.</strong><br>Saldo regular para consumo e novos pedidos.</div>`;}
function movementValueV141(m){const v=centsV141(m.valorCentavos);if(['consumo','venda_conta','compra_farda'].includes(m.tipo)||m.subtipo==='consumo')return -Math.abs(v);return v;}
function movementDetailsV141(m){if(m.saldoAntesCentavos!==undefined)return `Saldo: ${fmtSignedV141(m.saldoAntesCentavos)} → ${fmtSignedV141(m.saldoDepoisCentavos)}`;return (m.itens||[]).map(x=>`${x.quantidade}× ${esc(x.nome)}`).join(', ')||esc(paymentMethodLabelV141(m.formaPagamento)||'-');}

async function openStudentDetailsV141(id){
  const a=state.students.find(x=>x.id===id),acc=await getAccount(id);if(!a)return;
  const ms=await db.collection('movimentos_conta').where('alunoId','==',id).get().catch(()=>({docs:[]}));
  const moves=ms.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>String(y.criadoEm).localeCompare(String(x.criadoEm))).slice(0,50);
  const pending=await pendingCheckoutsV141(id);
  const canManage=canStaffManageV141();
  openModal('Conta do aluno',`<div class="status-panel"><div class="small">${esc(a.turma)} · Matrícula ${esc(a.matricula)}</div><div class="big">${esc(a.nome)}</div><div class="small">Responsável: ${esc(a.responsavelFinanceiro)}</div></div>${balanceSummaryHtmlV141(acc)}${accountStatusHtmlV141(acc)}${pending.length?`<div class="v141-alert-inline"><strong>${pending.length} pagamento(s) pendente(s).</strong><br>É permitido gerar outro link, mas se mais de um for pago, todos os valores entram no saldo do aluno.</div>`:''}<div class="switch-line"><div><strong>Compra sem saldo</strong><div class="muted">${acc.autorizadoSemSaldo?'Autorizada pelo responsável':'Bloqueada pelo responsável'}</div></div><span class="badge ${acc.autorizadoSemSaldo?'b-green':'b-red'}">${acc.autorizadoSemSaldo?'liberada':'bloqueada'}</span></div>${canManage?`<div class="actions" style="margin:12px 0"><button class="btn btn-primary" onclick="openAccountPaymentV141('${id}','staff')">Gerar link InfinitePay</button><button class="btn btn-green" onclick="registerManualPaymentV141('${id}')">Registrar pagamento presencial</button><button class="btn btn-outline" onclick="toggleManualBlock('${id}',${!acc.bloqueioManual})">${acc.bloqueioManual?'Remover bloqueio manual':'Bloquear conta'}</button><button class="btn btn-light" onclick="generateReport('${id}')">Relatório PDF / imagem</button></div>`:''}<div class="card-title" style="margin:15px 0 8px">Movimentos recentes</div>${moves.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Detalhes</th><th style="text-align:right">Entrada/Saída</th></tr></thead><tbody>${moves.map(m=>`<tr><td>${humanDate(m.criadoEm)}</td><td>${esc(m.subtipo||m.tipo)}</td><td>${movementDetailsV141(m)}</td><td class="money">${fmtSignedV141(movementValueV141(m))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sem movimentos.</div>'}`);
}
window.openStudentDetails=openStudentDetailsV141;
window.openStudentDetailsV141=openStudentDetailsV141;

async function renderParentPortalV141(){
  const a=state.parentStudent,acc=await getAccount(a.id);if(!a)return renderParentLogin();
  $('#userPill').textContent='Responsável · '+a.nome.split(' ')[0];$('#userPill').classList.remove('hidden');$('#switchUserBtn').classList.remove('hidden');
  const snap=await db.collection('movimentos_conta').where('alunoId','==',a.id).get().catch(()=>({docs:[]}));
  const moves=snap.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>String(y.criadoEm).localeCompare(String(x.criadoEm))).slice(0,80);
  const pending=await pendingCheckoutsV141(a.id),net=accountNetV141(acc),min=net<0?Math.abs(net):cfgV141().valorMinimoCheckoutPositivoCentavos;
  $('#parentScreen').innerHTML=`<div class="parent-wrap"><div class="parent-hero"><h2>${esc(a.nome)}</h2><p>${esc(a.turma)} · Matrícula ${esc(a.matricula)}</p></div>${balanceSummaryHtmlV141(acc)}${accountStatusHtmlV141(acc)}${pending.length?`<div class="v141-alert-inline"><strong>Existe pagamento aguardando confirmação.</strong><br>Você pode gerar um novo link, mas se os dois forem pagos, os dois valores serão adicionados ao saldo do aluno.</div>`:''}<div class="grid g2" style="margin-top:14px"><div class="card"><div class="card-head"><div class="card-title">Compra sem saldo</div></div><div class="card-body"><div class="switch-line"><div><strong>${acc.autorizadoSemSaldo?'Autorizada':'Bloqueada'}</strong><div class="muted">Permitir que o aluno compre na cantina sem crédito pré-pago, dentro do limite configurado.</div></div><div class="switch ${acc.autorizadoSemSaldo?'on':''}" onclick="parentToggleAuthorization(${!acc.autorizadoSemSaldo})"></div></div><div class="fg" style="margin-top:13px"><label>Limite escolhido — máximo ${fmt(cfgV141().limiteMaximoFiadoCentavos)}</label><input id="parentLimit" type="number" min="0" max="${cfgV141().limiteMaximoFiadoCentavos/100}" step="1" class="fi" value="${Number(acc.limiteFiadoCentavos||0)/100}"></div><button class="btn btn-primary" onclick="saveParentLimit()">Salvar limite</button></div></div><div class="card"><div class="card-head"><div class="card-title">${net<0?'Regularizar saldo':'Adicionar crédito'}</div></div><div class="card-body"><div class="alert">${net<0?`O valor mínimo para regularizar é ${fmt(min)}. Você pode pagar mais e deixar crédito para novas compras.`:`Escolha um valor para adicionar à conta do aluno. Mínimo de teste: ${fmt(min)}.`}</div><button class="btn btn-green" style="width:100%;margin-top:12px" onclick="openAccountPaymentV141('${a.id}','responsavel')">${net<0?'Regularizar saldo':'Adicionar crédito'}</button></div></div></div><div class="card" style="margin-top:14px"><div class="card-head"><div class="card-title">Pedidos antecipados</div><button class="btn btn-primary" onclick="openParentOrder()">Novo pedido</button></div><div class="card-body"><p class="muted">Pedidos avulsos, semanais e mensais continuam separados. Nesta versão, o checkout ativo é para entrada na conta do aluno.</p></div></div><div class="card" style="margin-top:14px"><div class="card-head"><div class="card-title">Lançamentos</div></div>${moves.length?`<div class="table-wrap" style="border:0"><table><thead><tr><th>Data</th><th>Tipo</th><th>Detalhes</th><th style="text-align:right">Entrada/Saída</th></tr></thead><tbody>${moves.map(m=>`<tr><td>${humanDate(m.criadoEm)}</td><td>${esc(m.subtipo||m.tipo)}</td><td>${movementDetailsV141(m)}</td><td class="money">${fmtSignedV141(movementValueV141(m))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum lançamento.</div>'}</div><button class="btn btn-outline" style="width:100%;margin-top:12px" onclick="renderParentLogin()">Sair da conta</button></div>`;
}
window.renderParentPortal=renderParentPortalV141;
window.renderParentPortalV141=renderParentPortalV141;

async function openAccountPaymentV141(alunoId,context='staff'){
  const a=state.students.find(x=>x.id===alunoId);if(!a)return alert('Aluno não encontrado.');
  const [acc,buyer,pending]=await Promise.all([getAccount(alunoId),getSavedBuyerV141(alunoId),pendingCheckoutsV141(alunoId)]);
  const net=accountNetV141(acc),min=net<0?Math.abs(net):cfgV141().valorMinimoCheckoutPositivoCentavos,defaultValue=net<0?min:1000;
  openModal(net<0?'Regularizar saldo':'Adicionar crédito',`<div class="status-panel"><div class="small">${esc(a.turma)} · Matrícula ${esc(a.matricula)}</div><div class="big">${esc(a.nome)}</div><div class="small">Saldo atual: <strong>${fmtSignedV141(net)}</strong></div></div>${pending.length?`<div class="v141-alert-inline"><strong>Já existe link pendente.</strong><br>Você pode gerar outro. Se mais de um link for pago, todos os valores entram como crédito/saldo do aluno.</div>`:''}<div class="alert">${net<0?`Valor mínimo para regularizar: <strong>${fmt(min)}</strong>.`:`Valor mínimo para adicionar crédito: <strong>${fmt(min)}</strong>.`}</div><div class="v141-chipbar"><button class="btn btn-light" onclick="$('#v141PayAmount').value='${(min/100).toFixed(2).replace('.',',')}'">Mínimo</button><button class="btn btn-light" onclick="$('#v141PayAmount').value='10,00'">R$ 10</button><button class="btn btn-light" onclick="$('#v141PayAmount').value='20,00'">R$ 20</button><button class="btn btn-light" onclick="$('#v141PayAmount').value='30,00'">R$ 30</button><button class="btn btn-light" onclick="$('#v141PayAmount').value='50,00'">R$ 50</button></div><div class="fg"><label>Valor do pagamento</label><input id="v141PayAmount" class="fi" value="${(defaultValue/100).toFixed(2).replace('.',',')}"></div><div class="grid g3" style="margin-top:10px"><div class="fg"><label>Nome do comprador <span class="muted">opcional</span></label><input id="v141BuyerName" class="fi" value="${esc(buyer.name||a.responsavelFinanceiro||'')}"></div><div class="fg"><label>Telefone <span class="muted">opcional</span></label><input id="v141BuyerPhone" class="fi" value="${esc(buyer.phone_number||a.celularResponsavel||'')}"></div><div class="fg"><label>E-mail <span class="muted">opcional</span></label><input id="v141BuyerEmail" class="fi" value="${esc(buyer.email||'')}"></div></div><label class="switch-line" style="margin-top:10px"><div><strong>Salvar dados para próximos pagamentos</strong><div class="muted">Somente nome, telefone e e-mail. Cartão não fica salvo no sistema da escola.</div></div><input id="v141SaveBuyer" type="checkbox" checked></label><div class="actions" style="margin-top:14px"><button class="btn btn-green" onclick="confirmAccountCheckoutV141('${alunoId}','${context}')">Gerar pagamento InfinitePay</button><button class="btn btn-outline" onclick="closeModal()">Cancelar</button></div><div id="v141CheckoutResult"></div>`);
}
window.openAccountPaymentV141=openAccountPaymentV141;

async function confirmAccountCheckoutV141(alunoId,context='staff'){
  const a=state.students.find(x=>x.id===alunoId),acc=await getAccount(alunoId);if(!a)return;
  const amount=parseBRL($('#v141PayAmount').value),net=accountNetV141(acc),min=net<0?Math.abs(net):cfgV141().valorMinimoCheckoutPositivoCentavos;
  if(amount<min)return alert(net<0?`O valor mínimo para regularizar este saldo é ${fmt(min)}.`:`O valor mínimo para adicionar crédito é ${fmt(min)}.`);
  const pending=await pendingCheckoutsV141(alunoId);
  if(pending.length&&!confirm('Já existe pagamento pendente para este aluno. Deseja gerar outro mesmo assim?'))return;
  const actor=actorV141(),btn=document.querySelector('#modalBody .btn.btn-green');if(btn){btn.disabled=true;btn.textContent='Gerando link...'}
  try{
    const resp=await fetch('/api/criar-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:'entrada_conta_aluno',alunoId,valorCentavos:amount,comprador:{nome:$('#v141BuyerName').value,telefone:$('#v141BuyerPhone').value,email:$('#v141BuyerEmail').value},salvarComprador:$('#v141SaveBuyer').checked,criadoPorId:actor.id,criadoPorNome:actor.nome,criadoPorPerfil:actor.perfil})});
    const data=await resp.json().catch(()=>({}));if(!resp.ok)throw new Error(data.error||'Não foi possível gerar o checkout.');
    const url=normalizeCheckoutUrlV141(data.checkout_url);
    if(context==='responsavel'){location.href=url;return;}
    $('#v141CheckoutResult').innerHTML=`<div class="v141-payment-link"><strong>Link gerado:</strong><br>${esc(url)}<div class="actions" style="margin-top:8px"><button class="btn btn-light" onclick="navigator.clipboard.writeText('${esc(url)}');toast('Link copiado.')">Copiar link</button><button class="btn btn-primary" onclick="window.open('${esc(url)}','_blank')">Abrir checkout</button></div><div class="v141-mini">NSU: ${esc(data.order_nsu||'')}</div></div>`;toast('Link de pagamento gerado.');
  }catch(e){alert(e.message)}finally{if(btn){btn.disabled=false;btn.textContent='Gerar pagamento InfinitePay'}}
}
window.confirmAccountCheckoutV141=confirmAccountCheckoutV141;

function registerManualPaymentV141(id){
  openModal('Registrar pagamento presencial',`<div class="alert">Este lançamento entra na mesma conta corrente do aluno. Não gera link InfinitePay.</div><div class="fg"><label>Valor recebido</label><input id="manualPayAmount" class="fi" placeholder="0,00"></div><div class="fg"><label>Forma</label><select id="manualPayMethod" class="fi"><option value="dinheiro">Dinheiro</option><option value="pix_manual">Pix manual</option><option value="maquininha">Maquininha</option><option value="pix_banco">Pix banco</option><option value="pix_rede">Pix Rede / Laranjinha</option><option value="cartao_rede">Cartão Rede / Laranjinha</option></select></div><div class="fg"><label>Observação <span class="muted">opcional</span></label><input id="manualPayObs" class="fi" placeholder="Ex.: pagamento recebido na secretaria"></div><button class="btn btn-green" style="width:100%" onclick="saveManualPaymentV141('${id}')">Confirmar recebimento</button>`);
}
window.registerManualPayment=registerManualPaymentV141;
window.registerManualPaymentV141=registerManualPaymentV141;

async function saveManualPaymentV141(id){
  const amount=parseBRL($('#manualPayAmount').value);if(amount<=0)return alert('Informe o valor.');
  const method=$('#manualPayMethod').value,obs=$('#manualPayObs')?.value||'',accRef=db.collection('contas_alunos').doc(id),move=db.collection('movimentos_conta').doc(),pay=db.collection('pagamentos').doc(),actor=actorV141();
  await db.runTransaction(async tx=>{const s=await tx.get(accRef),a=s.exists?s.data():{};const before=accountNetV141(a),after=before+amount,split=splitNetV141(after);tx.set(accRef,{...split,bloqueioSaldoSemanal:after<0?Boolean(a.bloqueioSaldoSemanal):false,bloqueadoPorLimite:after<0&&centsV141(a.limiteFiadoCentavos)>0&&Math.abs(after)>=centsV141(a.limiteFiadoCentavos),ultimaRegularizacaoEm:after>=0?nowIso():(a.ultimaRegularizacaoEm||null),atualizadoEm:nowIso()},{merge:true});tx.set(move,{id:move.id,alunoId:id,tipo:'entrada_conta_aluno',subtipo:'pagamento_presencial',valorCentavos:amount,saldoAntesCentavos:before,saldoDepoisCentavos:after,formaPagamento:method,observacao:obs,usuarioId:actor.id,usuarioNome:actor.nome,usuarioPerfil:actor.perfil,dataChave:dateKey(),criadoEm:nowIso()});tx.set(pay,{id:pay.id,alunoId:id,valorBrutoCentavos:amount,formaPagamento:method,status:'confirmado',origem:'secretaria_presencial',usuarioId:actor.id,usuarioNome:actor.nome,usuarioPerfil:actor.perfil,dataChave:dateKey(),criadoEm:nowIso(),observacao:obs})});
  await audit('pagamento_presencial_conta_aluno',{alunoId:id,valorCentavos:amount,forma:method,descricao:`Pagamento presencial de ${fmt(amount)} registrado.`});closeModal();toast('Pagamento presencial registrado.');
}
window.saveManualPayment=saveManualPaymentV141;
window.saveManualPaymentV141=saveManualPaymentV141;

const _registerAccountConsumptionV141Before=window.registerAccountConsumption;
window.registerAccountConsumption=registerAccountConsumption=async function(){
  if(!state.cart.length)return;const student=state.selectedStudent,items=expandCart(state.cart),total=items.reduce((s,x)=>s+x.quantidade*x.precoUnitarioCentavos,0);
  try{const accountRef=db.collection('contas_alunos').doc(student.id),moveRef=db.collection('movimentos_conta').doc(),saleRef=db.collection('vendas').doc();await db.runTransaction(async tx=>{const snap=await tx.get(accountRef),a=snap.exists?snap.data():{};const stock=await readSalgadoUpdateTx(tx,items,'consumo_conta');const before=accountNetV141(a),limite=centsV141(a.limiteFiadoCentavos||cfgV141().limiteMaximoFiadoCentavos),after=before-total;if(a.bloqueioManual)throw new Error('A conta está bloqueada pela secretaria ou gestão.');if(a.bloqueioSaldoSemanal&&before<0)throw new Error('A conta está bloqueada por saldo em aberto no fechamento semanal. Regularize o saldo para liberar novos consumos.');if(after<0&&!a.autorizadoSemSaldo)throw new Error('O responsável não autorizou compras sem saldo.');if(after<0&&Math.abs(after)>limite)throw new Error(`A compra ultrapassa o limite de saldo em aberto. Disponível: ${fmt(Math.max(0,limite-Math.max(0,-before)))}.`);const split=splitNetV141(after),hit=after<0&&Math.abs(after)>=limite;if(stock)tx.set(stock.ref,stock.data,{merge:true});tx.set(accountRef,{...split,bloqueadoPorLimite:hit,atualizadoEm:nowIso()},{merge:true});tx.set(moveRef,{id:moveRef.id,alunoId:student.id,tipo:'consumo',subtipo:'consumo_cantina',valorCentavos:total,saldoAntesCentavos:before,saldoDepoisCentavos:after,itens:items,origem:'cantina',usuarioId:state.user.id,usuarioNome:state.user.nome,dataChave:dateKey(),criadoEm:nowIso()});tx.set(saleRef,{id:saleRef.id,alunoId:student.id,origem:'cantina',operadorId:state.user.id,operadorNome:state.user.nome,formaPagamento:after>=0?'conta_credito':'conta_aluno',valorBrutoCentavos:total,itens:items,dataChave:dateKey(),criadoEm:nowIso(),status:'confirmada'});if(hit){const alertRef=db.collection('alertas').doc();tx.set(alertRef,{tipo:'limite_atingido',alunoId:student.id,alunoNome:student.nome,saldoContaCentavos:after,limiteCentavos:limite,status:'pendente',criadoEm:nowIso()})}});await audit('consumo_conta',{alunoId:student.id,valorCentavos:total});closeModal();toast('Consumo registrado na conta.')}catch(e){alert(e.message)}
};

window.weeklyClose=weeklyClose=async function(){
  if(!canStaffManageV141())return alert('Apenas secretaria, gestão ou administração podem executar o fechamento.');
  if(!confirm('Aplicar fechamento semanal? Todos os alunos com saldo negativo serão bloqueados até regularizar o saldo.'))return;
  const snap=await db.collection('contas_alunos').get(),batch=db.batch();let blocked=0,negative=0;const now=nowIso();
  snap.docs.forEach(d=>{const acc={id:d.id,...d.data()},net=accountNetV141(acc);if(net<0){negative++;blocked++;batch.set(d.ref,{...splitNetV141(net),bloqueioSaldoSemanal:true,bloqueadoEm:now,motivoBloqueio:'saldo_em_aberto_fechamento_semanal',atualizadoEm:now},{merge:true});}else{batch.set(d.ref,{...splitNetV141(net),bloqueioSaldoSemanal:false,atualizadoEm:now},{merge:true});}});
  await batch.commit();await db.collection('fechamentos_semanais').add({dataChave:dateKey(),tipo:'bloqueio_saldo_semanal',alunosNegativos:negative,alunosBloqueados:blocked,usuarioId:state.user.id,usuarioNome:state.user.nome,criadoEm:now});await audit('bloqueio_semanal_saldo',{quantidadeBloqueada:blocked,descricao:`Fechamento semanal bloqueou ${blocked} aluno(s) com saldo negativo.`});toast(`Fechamento aplicado: ${blocked} conta(s) bloqueada(s).`);renderCobrancas();
};

async function renderCobrancasV141(){
  const el=$('#mainContent');el.innerHTML=pageHeader('Cobranças e saldos','Conta corrente dos alunos, bloqueio semanal e pagamentos InfinitePay.')+'<div class="empty">Carregando...</div>';
  const [snap,checkouts]=await Promise.all([db.collection('contas_alunos').get(),recentCheckoutsV141(60)]);
  const rows=snap.docs.map(d=>({id:d.id,...d.data(),saldoContaCentavos:accountNetV141(d.data())})).filter(x=>x.saldoContaCentavos<0||isBlockedV141(x)).sort((a,b)=>a.saldoContaCentavos-b.saldoContaCentavos);
  const blocked=rows.filter(isBlockedV141).length,totalOpen=rows.reduce((s,x)=>s+Math.max(0,-accountNetV141(x)),0),pending=checkouts.filter(x=>(x.status||'aguardando_pagamento')==='aguardando_pagamento').length,paid=checkouts.filter(x=>x.status==='pago').length;
  el.innerHTML=pageHeader('Cobranças e saldos','Conta corrente dos alunos, bloqueio semanal e pagamentos InfinitePay.',`<button class="btn btn-orange" onclick="weeklyClose()">Fechamento semanal</button>`)+`<div class="grid g4"><div class="kpi orange"><div class="kpi-label">Saldo em aberto</div><div class="kpi-value">${fmt(totalOpen)}</div></div><div class="kpi red"><div class="kpi-label">Contas bloqueadas</div><div class="kpi-value">${blocked}</div></div><div class="kpi"><div class="kpi-label">Links pendentes</div><div class="kpi-value">${pending}</div></div><div class="kpi green"><div class="kpi-label">Pagos recentes</div><div class="kpi-value">${paid}</div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="card-head"><div class="card-title">Alunos com saldo em aberto / bloqueio</div><span class="badge b-yellow">${rows.length}</span></div>${rows.length?`<div class="table-wrap" style="border:0;border-radius:0"><table><thead><tr><th>Aluno</th><th>Turma</th><th>Status</th><th>Limite</th><th style="text-align:right">Saldo</th><th>Ações</th></tr></thead><tbody>${rows.map(r=>{const a=state.students.find(x=>x.id===r.id)||{};const net=accountNetV141(r);return`<tr class="${isBlockedV141(r)?'v141-row-blocked':net<0?'v141-row-warn':''}"><td><strong>${esc(a.nome||r.id)}</strong><div class="muted">${esc(a.matricula||'')}</div></td><td>${esc(a.turma||'-')}</td><td><span class="badge ${isBlockedV141(r)?'b-red':'b-yellow'}">${isBlockedV141(r)?'bloqueada':'em aberto'}</span><div class="muted">${esc(blockedReasonV141(r))}</div></td><td>${fmt(r.limiteFiadoCentavos||cfgV141().limiteMaximoFiadoCentavos)}</td><td class="money">${fmtSignedV141(net)}</td><td><div class="actions"><button class="btn btn-primary" onclick="openAccountPaymentV141('${r.id}','staff')">Gerar link</button><button class="btn btn-green" onclick="registerManualPaymentV141('${r.id}')">Registrar pgto.</button><button class="btn btn-light" onclick="copyParentLink('${r.id}')">Portal</button></div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma conta em aberto ou bloqueada.</div>'}</div><div class="card"><div class="card-head"><div class="card-title">Pagamentos InfinitePay</div><button class="btn btn-light" onclick="renderCobrancas()">Atualizar</button></div>${checkoutTableV141(checkouts)}</div></div>`;
}
function checkoutTableV141(rows){if(!rows.length)return '<div class="empty">Nenhum link gerado ainda.</div>';return `<div class="table-wrap" style="border:0;border-radius:0"><table><thead><tr><th>Data</th><th>Aluno</th><th>Status</th><th style="text-align:right">Valor</th><th>Ações</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${humanDate(p.criadoEm)}</td><td><strong>${esc(p.alunoNome||'-')}</strong><div class="muted">${esc(p.orderNsu||p.id)}</div></td><td><span class="badge ${p.status==='pago'?'b-green':p.status==='aguardando_pagamento'?'b-yellow':'b-red'}">${paymentStatusLabelV141(p.status||'aguardando_pagamento')}</span></td><td class="money">${fmt(p.totalCentavos)}</td><td><div class="actions">${p.checkoutUrl?`<button class="btn btn-light" onclick="window.open('${esc(p.checkoutUrl)}','_blank')">Abrir</button>`:''}<button class="btn btn-primary" onclick="verifyCheckoutPaymentV141('${esc(p.orderNsu||p.id)}')">Verificar</button></div></td></tr>`).join('')}</tbody></table></div>`}
window.renderCobrancas=renderCobrancasV141;
window.renderCobrancasV141=renderCobrancasV141;

async function verifyCheckoutPaymentV141(orderNsu){try{const resp=await fetch('/api/verificar-pagamento',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_nsu:orderNsu})});const data=await resp.json().catch(()=>({}));if(!resp.ok)throw new Error(data.error||'Erro ao verificar pagamento.');toast(data.paid?'Pagamento confirmado e aplicado.':'Pagamento ainda não confirmado.');renderCobrancas();}catch(e){alert(e.message)}}
window.verifyCheckoutPaymentV141=verifyCheckoutPaymentV141;

async function renderDashboardV141(){
  const el=$('#mainContent');el.innerHTML=pageHeader('Resumo do sistema','Operação atual da escola.')+'<div class="empty">Carregando indicadores...</div>';const today=dateKey();
  const [vs,os,acs,fs,pcs]=await Promise.all([db.collection('vendas').where('dataChave','==',today).get().catch(()=>({docs:[]})),db.collection('ocorrencias_entrega').where('dataChave','==',today).get().catch(()=>({docs:[]})),db.collection('contas_alunos').get(),db.collection('pedidos_farda').get().catch(()=>({docs:[]})),recentCheckoutsV141(40)]);
  const sales=vs.docs.map(d=>d.data()),occ=os.docs.map(d=>d.data()),accounts=acs.docs.map(d=>d.data()),fardas=fs.docs.map(d=>d.data());const gross=sales.reduce((s,x)=>s+Number(x.valorBrutoCentavos||0),0);const open=accounts.reduce((s,x)=>s+Math.max(0,-accountNetV141(x)),0);const blocked=accounts.filter(isBlockedV141).length;const pendingUniform=fardas.filter(x=>!['entregue','cancelado'].includes(x.statusAtendimento)).length;const pendingPay=pcs.filter(x=>(x.status||'aguardando_pagamento')==='aguardando_pagamento').length;
  el.innerHTML=pageHeader('Resumo do sistema','Operação atual da escola.')+`<div class="grid g4"><div class="kpi"><div class="kpi-label">Vendas registradas hoje</div><div class="kpi-value">${fmt(gross)}</div><div class="kpi-sub">${sales.length} operações</div></div><div class="kpi orange"><div class="kpi-label">Saldo em aberto</div><div class="kpi-value">${fmt(open)}</div><div class="kpi-sub">Conta corrente dos alunos</div></div><div class="kpi red"><div class="kpi-label">Contas bloqueadas</div><div class="kpi-value">${blocked}</div><div class="kpi-sub">saldo semanal, limite ou manual</div></div><div class="kpi green"><div class="kpi-label">Links pendentes</div><div class="kpi-value">${pendingPay}</div><div class="kpi-sub">InfinitePay aguardando</div></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="card-head"><div class="card-title">Entregas de hoje</div></div><div class="card-body"><div class="kpi-value">${occ.filter(x=>x.status==='programado').length}</div><span class="muted">Pedidos programados para a data.</span></div></div><div class="card"><div class="card-head"><div class="card-title">Fardas pendentes</div></div><div class="card-body"><div class="kpi-value">${pendingUniform}</div><span class="muted">Pedidos em reserva, produção ou entrega.</span></div></div></div>`;
}
window.renderDashboard=renderDashboardV141;

function renderConfigV141(){const c=cfgV141();$('#mainContent').innerHTML=pageHeader('Configurações','Parâmetros operacionais da escola e da conta corrente.')+`<div class="grid g2"><div class="card"><div class="card-head"><div class="card-title">Conta corrente do aluno</div></div><div class="card-body"><div class="fg"><label>Limite máximo de saldo em aberto</label><input id="cfgLimit" class="fi" value="${(c.limiteMaximoFiadoCentavos/100).toFixed(2).replace('.',',')}"></div><div class="fg"><label>Valor mínimo para checkout com saldo regular</label><input id="cfgMinCheckout" class="fi" value="${(c.valorMinimoCheckoutPositivoCentavos/100).toFixed(2).replace('.',',')}"></div><label class="switch-line"><div><strong>Bloqueio semanal automático</strong><div class="muted">Toda sexta-feira, alunos com saldo negativo são bloqueados até regularizar.</div></div><input id="cfgBlockWeekly" type="checkbox" ${c.bloqueioSemanalSaldoAtivo?'checked':''}></label><label class="switch-line"><div><strong>Permitir novo link com pagamento pendente</strong><div class="muted">Se dois links forem pagos, os dois valores entram na conta.</div></div><input id="cfgMultiPending" type="checkbox" ${c.permitirMultiplosLinksPendentes?'checked':''}></label><button class="btn btn-primary" onclick="saveConfig()">Salvar</button></div></div><div class="card"><div class="card-head"><div class="card-title">Preços e estoque base</div></div><div class="card-body"><div class="fg"><label>Salgados padrão por dia</label><input id="cfgSalgado" type="number" class="fi" value="${state.config.quantidadePadraoSalgados||30}"></div><div class="fg"><label>Preço camisa 4 a 14</label><input id="cfgUniformChild" class="fi" value="${((state.config.precoFardaInfantilCentavos||4200)/100).toFixed(2).replace('.',',')}"></div><div class="fg"><label>Preço camisa P a XGG</label><input id="cfgUniformAdult" class="fi" value="${((state.config.precoFardaAdultoCentavos||4700)/100).toFixed(2).replace('.',',')}"></div><button class="btn btn-primary" onclick="saveConfig()">Salvar</button></div></div></div>`}

window.saveConfig=async function saveConfigV141(){await db.collection('configuracoes').doc('sistema').set({versao:V141_VERSION,limiteMaximoFiadoCentavos:parseBRL($('#cfgLimit')?.value||50),valorMinimoCheckoutPositivoCentavos:parseBRL($('#cfgMinCheckout')?.value||1),bloqueioSemanalSaldoAtivo:!!$('#cfgBlockWeekly')?.checked,diaBloqueioSemanalSaldo:'sexta',permitirMultiplosLinksPendentes:!!$('#cfgMultiPending')?.checked,quantidadePadraoSalgados:Number($('#cfgSalgado')?.value||state.config.quantidadePadraoSalgados||30),precoFardaInfantilCentavos:parseBRL($('#cfgUniformChild')?.value||42),precoFardaAdultoCentavos:parseBRL($('#cfgUniformAdult')?.value||47),checkoutInfinitePayAtivo:true,atualizadoEm:nowIso()},{merge:true});await loadCore();toast('Configurações salvas.');};

const _saveParentLimitV141Before=window.saveParentLimit;
window.saveParentLimit=saveParentLimit=async function(){const max=cfgV141().limiteMaximoFiadoCentavos/100;const v=Math.max(0,Math.min(max,Number($('#parentLimit').value||0))),acc=await getAccount(state.parentStudent.id),limit=Math.round(v*100);await db.collection('contas_alunos').doc(state.parentStudent.id).set({limiteFiadoCentavos:limit,bloqueadoPorLimite:accountNetV141(acc)<0&&Math.abs(accountNetV141(acc))>=limit,atualizadoEm:nowIso()},{merge:true});await audit('limite_responsavel',{alunoId:state.parentStudent.id,limiteCentavos:limit});toast('Limite salvo.');renderParentPortalV141();};

window.parentToggleAuthorization=parentToggleAuthorization=async function(val){const max=cfgV141().limiteMaximoFiadoCentavos;const typed=Math.round(Number($('#parentLimit')?.value||max/100)*100);const limit=val?Math.max(0,Math.min(max,typed)):centsV141((await getAccount(state.parentStudent.id)).limiteFiadoCentavos||0);await db.collection('contas_alunos').doc(state.parentStudent.id).set({autorizadoSemSaldo:val,limiteFiadoCentavos:limit,atualizadoEm:nowIso()},{merge:true});await audit('autorizacao_responsavel',{alunoId:state.parentStudent.id,autorizado:val,limiteCentavos:limit});renderParentPortalV141();};

window.askCreditAmount=function askCreditAmountV141(){if(!state.parentStudent)return;openAccountPaymentV141(state.parentStudent.id,'responsavel');};
window.startCheckout=async function startCheckoutV141(type,amount=0,order=null){if(!state.parentStudent)return alert('Aluno não identificado.');if(type==='quitar_divida'||type==='adicionar_credito'||type==='regularizar_saldo'||type==='entrada_conta_aluno')return openAccountPaymentV141(state.parentStudent.id,'responsavel');alert('Nesta versão, o checkout ativo é a entrada na conta corrente do aluno.');};
