<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="application-version" content="1.6.0-rc2.4.1-caixa-page-hotfix">
  <meta name="theme-color" content="#2C3896">
  <link rel="icon" href="/assets/logo-piaget-icon-v152.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Escola Piaget — Vendas, Cantina e Atendimento</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/css/app.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo"><img src="/assets/logo-piaget-icon-v152.png" alt="Símbolo da Escola Piaget"></div>
      <div><h1>Escola Piaget</h1><small>Vendas, cantina e atendimento</small></div>
    </div>
    <div class="top-actions">
      <span class="pill app-version-pill hidden" id="appVersionPill" title="Versão do sistema">v1.6.0-rc2.4.1-caixa-page-hotfix</span>
      <button type="button" class="v151-mobile-menu hidden" id="v151MenuBtn" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">☰</button>
      <span class="pill" id="connectionPill">Conectando...</span>
      <span class="pill hidden" id="userPill"></span>
      <button type="button" class="btn btn-orange hidden" id="switchUserBtn" onclick="logoutProfile()" aria-label="Sair do acesso atual">Sair</button>
    </div>
  </header>

  <section class="role-screen" id="bootScreen">
    <div class="setup">
      <div class="accent"></div>
      <h2>Carregando o sistema</h2>
      <p class="muted" id="bootText">Conectando ao Firestore...</p>
      <div class="progress"><i id="bootProgress"></i></div>
      <div class="alert danger hidden" id="bootError" style="margin-top:14px"></div>
      <button type="button" class="btn btn-primary hidden" id="retryBtn" onclick="boot()" style="margin-top:12px">Tentar novamente</button>
    </div>
  </section>


  <section class="role-screen hidden" id="roleScreen">
    <div class="role-box">
      <div class="access-logo-v130">
        <img src="/assets/logo-piaget-icon-v152.png" alt="Símbolo Escola Piaget">
        <div><strong>Escola Piaget</strong><span>Carregando acesso seguro…</span></div>
      </div>
    </div>
  </section>

  <div class="hidden" id="parentScreen"></div>

  <div class="shell hidden" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Menu principal"></aside>
    <main class="main" id="mainContent"></main>
  </div>

  <div class="v151-menu-overlay" id="v151MenuOverlay" aria-hidden="true"></div>

  <div class="modal-back" id="modalBack" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head"><strong id="modalTitle">Detalhes</strong><button type="button" class="x" onclick="closeModal()" aria-label="Fechar">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="hidden" id="reportHost"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/00-portal-utils.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/01-core.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/02-operations.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/03-cash.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/04-brand.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/05-auth.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/06-notifications-navigation.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/07-account-checkout.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/08-orders-agenda.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/09-portal-sales.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/10-mobile-runtime.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/12-portal-finalization.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/13-secretary-online-sales.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/14-catalog-sales.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/15-operational-views.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/16-cash-responsibility.js"></script>
  <script defer src="/releases/1.6.0-rc2.4.1-caixa-page-hotfix/js/11-bootstrap.js"></script>
</body>
</html>
