<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2C3896"><link rel="icon" href="/assets/logo-piaget-icon-v152.png"><title>Pagamento — Escola Piaget</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#172033;font-family:Inter,Arial,sans-serif}.top{height:8px;background:#2C3896}.wrap{max-width:620px;margin:28px auto;padding:16px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.brand img{width:52px;height:52px;object-fit:contain}.brand strong{font-size:21px;color:#2C3896}.card{background:#fff;border:1px solid #e2e6f0;border-radius:18px;box-shadow:0 12px 34px rgba(30,44,94,.08);padding:22px;margin-bottom:14px}.muted{color:#687189;font-size:14px}.summary{display:grid;grid-template-columns:1fr auto;gap:11px;margin-top:17px;padding-top:14px;border-top:1px solid #edf0f6}.summary b{color:#2C3896}.items{margin:12px 0}.item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf0f6}.fg{margin:12px 0}.fg label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}.fi{width:100%;min-height:48px;border:1px solid #cfd5e2;border-radius:11px;padding:11px 13px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:#2C3896;color:#fff}.outline{background:#fff;color:#2C3896;border:1px solid #2C3896;margin-top:8px}.alert{padding:12px;border-radius:11px;background:#fff5e8;color:#8a5200;margin:12px 0}.error{background:#ffecec;color:#9b2020}.loader{text-align:center;padding:35px;color:#687189}.buyer-summary{padding:13px;background:#f6f7fb;border-radius:12px;line-height:1.55}.field-error{color:#a32929;font-size:12px;margin-top:5px}.fi.invalid{border-color:#c72e2e;background:#fff7f7}.hidden{display:none!important}@media(max-width:640px){.wrap{margin:8px auto;padding:12px}.card{padding:17px;border-radius:15px}.brand{margin:8px 4px 14px}}</style></head><body><div class="top"></div><main class="wrap"><div class="brand"><img src="/assets/logo-piaget-icon-v152.png" alt=""><div><strong>Escola Piaget</strong><div class="muted">Pagamento seguro</div></div></div><div id="app" class="card"><div class="loader">Carregando cobrança...</div></div></main><script>const $=s=>document.querySelector(s),q=new URLSearchParams(location.search),id=q.get('id')||'',token=q.get('token')||'';let sale=null,editing=false;const money=c=>(Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function buyerIssues(c={}){const e={};const name=String(c.name||'').trim(),email=String(c.email||'').trim(),digits=String(c.phone_number||'').replace(/\D/g,'');if(name.length<3)e.name='Informe o nome completo.';if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))e.email='Informe um e-mail válido.';if(![10,11].includes(digits.length))e.phone='Informe um telefone com DDD.';return e}function valid(c={}){return Object.keys(buyerIssues(c)).length===0}async function load(){try{const r=await fetch(`/api/obter-venda-online?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Link indisponível.');sale=d.venda;if(['pago','pago_revisao','concluido_saldo'].includes(sale.status)){document.querySelector('#app').innerHTML='<h2>Pagamento concluído</h2><div class="alert">Esta cobrança já foi processada pela Escola Piaget.</div>';return}render(d.customer||{})}catch(e){$('#app').innerHTML=`<div class="alert error"><strong>Não foi possível abrir o pagamento</strong><div style="margin-top:6px">${esc(e.message)}</div></div>`}}function itemLines(){if(sale.operacao==='regularizar_debito')return`<div class="item"><span>Regularização do saldo</span><b>${money(sale.totalCentavos)}</b></div>`;if(sale.operacao==='adicionar_credito')return`<div class="item"><span>Crédito na conta</span><b>${money(sale.totalCentavos)}</b></div>`;const items=sale.itens||[];if(items.length)return items.map(x=>{const meta=x.metadados||{},detail=[meta.competencia,meta.referencia,x.tamanho?`Tam. ${x.tamanho}`:''].filter(Boolean).join(' · ');return `<div class="item"><span>${Number(x.quantidade||1)}× ${esc(x.nome||'Item')}${detail?`<small style="display:block;color:#687189;margin-top:3px">${esc(detail)}</small>`:''}</span><b>${money(Number(x.precoUnitarioCentavos||0)*Number(x.quantidade||1))}</b></div>`}).join('');const days=sale.pedido?.dias||sale.pedido?.days||[];return`<div class="item"><span>${days.length||1} entrega(s) de cantina</span><b>${money(sale.totalCentavos)}</b></div>`}function render(customer){const complete=valid(customer);editing=!complete;$('#app').innerHTML=`<h2 style="margin:0 0 4px">Confira a cobrança</h2><div class="muted">Aluno: <strong>${esc(sale.alunoNome)}</strong>${sale.matricula?` · Matrícula ${esc(sale.matricula)}`:''}</div><div class="items">${itemLines()}</div><div class="summary"><span>Valor da compra</span><b>${money(sale.totalCentavos)}</b><span>Pagamento estimado</span><b>${money(sale.valorExternoEstimadoCentavos)}</b></div><h3 style="margin-top:24px">Dados do comprador</h3><div id="buyerSummary" class="buyer-summary ${editing?'hidden':''}"><strong id="buyerNameText">${esc(customer.name||'')}</strong><br><span id="buyerPhoneText">${esc(customer.phone_number||'')}</span><br><span id="buyerEmailText">${esc(customer.email||'')}</span></div><button id="editBtn" class="btn outline ${editing?'hidden':''}" onclick="editBuyer()">Alterar dados</button><div id="buyerForm" class="${editing?'':'hidden'}"><div class="fg"><label>Nome do comprador</label><input id="name" class="fi" autocomplete="name" value="${esc(customer.name||'')}"></div><div class="fg"><label>Telefone</label><input id="phone" class="fi" inputmode="tel" autocomplete="tel" value="${esc(customer.phone_number||'')}"></div><div class="fg"><label>E-mail</label><input id="email" class="fi" inputmode="email" autocomplete="email" value="${esc(customer.email||'')}"></div></div><div id="msg"></div><button id="payBtn" class="btn primary" style="margin-top:14px" onclick="pay()">Continuar para o pagamento</button>`}function editBuyer(){editing=true;$('#buyerSummary').classList.add('hidden');$('#editBtn').classList.add('hidden');$('#buyerForm').classList.remove('hidden')}async function pay(){const customer=editing?{nome:$('#name').value.trim(),telefone:$('#phone').value.trim(),email:$('#email').value.trim()}:{nome:$('#buyerNameText').textContent,telefone:$('#buyerPhoneText').textContent,email:$('#buyerEmailText').textContent},btn=$('#payBtn'),msg=$('#msg');const issues=buyerIssues({name:customer.nome,phone_number:customer.telefone,email:customer.email});document.querySelectorAll('.fi').forEach(x=>x.classList.remove('invalid'));document.querySelectorAll('.field-error').forEach(x=>x.remove());if(Object.keys(issues).length){editing=true;$('#buyerSummary')?.classList.add('hidden');$('#editBtn')?.classList.add('hidden');$('#buyerForm')?.classList.remove('hidden');for(const [key,text] of Object.entries(issues)){const el=$(key==='name'?'#name':key==='phone'?'#phone':'#email');if(el){el.classList.add('invalid');el.insertAdjacentHTML('afterend',`<div class="field-error">${esc(text)}</div>`)}}msg.innerHTML='<div class="alert error">Revise os campos destacados.</div>';return}btn.disabled=true;btn.textContent='Preparando pagamento...';msg.innerHTML='';try{const r=await fetch('/api/iniciar-venda-online',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,token,comprador:customer})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Não foi possível iniciar o pagamento.');if(d.sem_checkout){$('#app').innerHTML='<h2>Operação confirmada</h2><div class="alert">A compra foi concluída usando o saldo disponível.</div>';return}if(!d.checkout_url)throw new Error('O endereço de pagamento ainda não está disponível.');location.href=d.checkout_url}catch(e){msg.innerHTML=`<div class="alert error">${esc(e.message)}</div>`;btn.disabled=false;btn.textContent='Tentar novamente'}}load();</script></body></html>
