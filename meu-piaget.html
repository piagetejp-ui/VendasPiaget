<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="application-version" content="1.6.0-rc2.7.14">
  <meta name="theme-color" content="#2C3896">
  <link rel="icon" href="/assets/logo-piaget-icon-v152.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Meu Piaget — Escola Piaget</title>
  <script>
  window.PIAGET_ENTRY_MODE='family';
  (function(){
    try{
      var h=(location.hostname||'').toLowerCase();
      if((h==='meupiaget.com.br'||h==='www.meupiaget.com.br')&&location.pathname==='/meu-piaget.html'){
        history.replaceState(history.state,'','/'+location.search+location.hash);
      }
    }catch(_){ }
  })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/releases/1.6.0-rc2.7.14/css/app.css">

  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo"><img src="/assets/logo-piaget-icon-v152.png" alt="Símbolo da Escola Piaget"></div>
      <div><h1>Escola Piaget</h1><small>Vendas, cantina e atendimento</small></div>
    </div>
    <div class="top-actions">
      <span class="pill app-version-pill hidden" id="appVersionPill" title="Versão do sistema">v1.6.0-rc2.7.14</span>
      <span class="pill" id="connectionPill">Conectando...</span>
      <span class="pill hidden" id="userPill"></span>
      <button type="button" class="btn btn-orange hidden" id="switchUserBtn" onclick="logoutProfile()" aria-label="Sair do acesso atual">Sair</button>
    </div>
  </header>

  <section class="role-screen" id="bootScreen">
    <div class="setup">
      <div class="accent"></div>
      <h2>Carregando o sistema</h2>
      <p class="muted" id="bootText">Preparando o sistema...</p>
      <div class="progress"><i id="bootProgress"></i></div>
      <div class="alert danger hidden" id="bootError" style="margin-top:14px"></div>
      <button type="button" class="btn btn-primary hidden" id="retryBtn" onclick="boot()" style="margin-top:12px">Tentar novamente</button>
    </div>
  </section>


  <section class="role-screen hidden" id="roleScreen">
    <div class="role-box">
      <div class="access-logo-v130">
        <img src="/assets/logo-piaget-icon-v152.png" alt="Símbolo Escola Piaget">
        <div><strong>Escola Piaget</strong><span>Carregando acesso seguro…</span></div>
      </div>
    </div>
  </section>

  <div class="hidden" id="parentScreen"></div>

  <div class="shell hidden" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="Menu principal"></aside>
    <main class="main" id="mainContent"></main>
  </div>

  <div class="v151-menu-overlay" id="v151MenuOverlay" aria-hidden="true"></div>

  <div class="modal-back" id="modalBack" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head"><strong id="modalTitle">Detalhes</strong><button type="button" class="x" onclick="closeModal()" aria-label="Fechar">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="hidden" id="reportHost"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script defer src="/releases/1.6.0-rc2.7.14/js/00-portal-utils.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/01-core.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/02-operations.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/03-cash.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/04-brand.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/05-auth.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/06-notifications-navigation.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/07-account-checkout.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/08-orders-agenda.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/09-portal-sales.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/10-mobile-runtime.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/12-portal-finalization.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/13-secretary-online-sales.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/14-catalog-sales.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/15-operational-views.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/16-cash-responsibility.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/17-integrated-experience.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/18-uniform-variants.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/19-orders-workflow.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/20-family-implantation.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/21-family-shared-experience.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/22-secretaria-finalization.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/23-document-reports.js"></script>
  <script defer src="/releases/1.6.0-rc2.7.14/js/11-bootstrap.js"></script>
</body>
</html>
